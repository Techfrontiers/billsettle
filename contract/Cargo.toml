[package]
name = "billsettle"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned exact: 5.30.0 is the version verified to resolve cleanly on 2026-11-01.
# (near-sdk 4.1.1 cannot resolve — parity-secp256k1 0.7.0 is yanked.)
near-sdk = "=5.30.0"

# near-sdk 5.x refuses a plain `cargo test`: its lib has a compile guard that
# only passes with one of the valid cfgs, and `unit-testing` (as a
# dev-dependency feature) is the one that unlocks host-side unit tests.
[dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
